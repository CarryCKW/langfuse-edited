# Secret 用于存储敏感信息（密码等）
# 注意：data 中的值需要 base64 编码
# 生成方式：echo -n 'your_password' | base64
apiVersion: v1
kind: Secret
metadata:
  name: langfuse-secrets
  namespace: langfuse
type: Opaque
data:
  # CLICKHOUSE_PASSWORD: 请将 "YOUR_BASE64_ENCODED_PASSWORD" 替换为实际密码的 base64 编码
  # 例如：echo -n 'your_clickhouse_password' | base64
  CLICKHOUSE_PASSWORD: "YWRtaW4="
