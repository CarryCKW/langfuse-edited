apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: langfuse
  labels:
    app: langfuse
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse
      component: redis
  template:
    metadata:
      labels:
        app: langfuse
        component: redis
    spec:
      containers:
        - name: redis
          image: registry.paas/cmss/redis:7_arm64
          imagePullPolicy: Always
          command:
            - redis-server
            - --requirepass
            - myredissecret
            - --maxmemory-policy
            - noeviction
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: langfuse
  labels:
    app: langfuse
    component: redis
spec:
  type: ClusterIP
  selector:
    app: langfuse
    component: redis
  ports:
    - name: redis
      protocol: TCP
      port: 6379
      targetPort: redis
